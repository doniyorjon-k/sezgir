<style>
/* Layout: one quiet centred column; the stage is the only framed object; everything else is type and space */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --ink: #1d2433;
  --muted: #6b7385;
  --line: #e4e7ec;
  --accent: #4f7f86;      /* soft dome teal */
  --accent-soft: #e6eff0;
  --accent-ink: #ffffff;
  --anor: #b9586a;        /* muted pomegranate */
  --gold: #c0975a;
  --good: #5e8f6c;
  --stage: #fbfbfc;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: var(--font-body);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --surface: #1b1f27; --ink: #e6e8ec; --muted: #9aa1ae; --line: #2a303b;
    --accent: #7fb0b6; --accent-soft: #22323a; --accent-ink: #10161a; --anor: #d07b8b; --gold: #d2ae74; --good: #82b590; --stage: #181b22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --surface: #1b1f27; --ink: #e6e8ec; --muted: #9aa1ae; --line: #2a303b;
  --accent: #7fb0b6; --accent-soft: #22323a; --accent-ink: #10161a; --anor: #d07b8b; --gold: #d2ae74; --good: #82b590; --stage: #181b22;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 40px; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; align-items: center; justify-content: space-between; padding-top: 16px; gap: 12px; flex-wrap: wrap; }
.head-right { display: flex; align-items: center; gap: 12px; }
.theme-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.theme-btn:hover { color: var(--ink); }
.theme-btn svg { display: block; }
.brand { font-weight: 600; font-size: 17px; letter-spacing: .01em; }
.brand span { color: var(--accent); }
.meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
#stageBox { position: relative; width: 100%; aspect-ratio: 8 / 5; max-width: 100%; background: var(--stage); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; touch-action: none; }
#cv { width: 100%; height: 100%; display: block; }
#hud { position: absolute; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; gap: 8px; padding: 0 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 480px) { .card { padding: 20px; } }
h1, h2 { font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -.015em; }
h1 { font-size: clamp(24px, 6vw, 32px); line-height: 1.2; }
h2 { font-size: 20px; }
p { margin: 0; }
.lead { color: var(--muted); max-width: 60ch; }
.tests { display: flex; flex-wrap: wrap; gap: 8px; }
.test-chip { border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; display: inline-flex; gap: 8px; align-items: center; background: var(--bg); color: var(--ink); }
.test-chip i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { font: 500 14px var(--font-body); border-radius: 10px; padding: 11px 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.tg { }
.btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; margin: -6px 0 -4px; color: var(--muted); font: 500 14px var(--font-body); cursor: pointer; }
.back:hover { color: var(--ink); }
.back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.back svg { display: block; }
.pick { display: flex; flex-direction: column; }
.pick-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 16px; gap: 14px; align-items: center; padding: 14px 4px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--ink); font: 400 15px var(--font-body); text-align: left; cursor: pointer; }
.pick-row:hover { background: var(--bg); }
.pick-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pick-row .tile { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); display: grid; place-items: center; }
.pick-row b { font-weight: 500; display: block; }
.pick-row small { color: var(--muted); font-size: 13px; display: block; line-height: 1.45; }
.pick-row .chev { color: var(--muted); }
.step { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.score-big { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score-big b { font-size: 56px; font-weight: 600; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.score-big span { font-size: 17px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 4px 12px; border-radius: 999px; }
.res { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
.res .nm { font-weight: 500; }
.res .det { color: var(--muted); font-size: 13px; min-width: 0; }
.res .pts { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-bottom: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; }
.stats div { text-align: center; }
.stats b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats small { color: var(--muted); font-size: 12px; }
pre.share { margin: 0; white-space: pre-wrap; background: var(--bg); border-radius: 10px; padding: 12px 14px; font: 14px/1.6 var(--font-body); }
.count-in { font: 600 20px var(--font-body); width: 110px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-align: center; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<style>
/* v2 additions: progress strip, panel under the stage, how-to list, radar */
#progress { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
#progress .seg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
#progress .seg i { height: 4px; border-radius: 2px; background: var(--line); display: block; }
#progress .seg.cur i { background: var(--ink); }
#progress .seg.done i { background: var(--accent); }
#progress .seg span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
#progress .seg.cur span { color: var(--ink); font-weight: 500; }
#progress .seg.done span b { color: var(--ink); font-weight: 600; }
.panel { display: flex; flex-direction: column; gap: 14px; }
.panel h2 { font-size: 22px; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.steps li { padding-left: 4px; }
.rule { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.rule::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.live { font-size: 17px; font-weight: 500; min-height: 1.6em; }
.live small { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
.verdict { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.verdict b { font-size: 44px; font-weight: 600; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.verdict .chip { font-size: 14px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 4px 12px; border-radius: 999px; }
.verdict .what { color: var(--muted); flex-basis: 100%; }
.statbar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.statbar[hidden] { display: none; }
.statbar > div { padding: 10px 8px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.statbar > div + div { border-left: 1px solid var(--line); }
.statbar b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.statbar b.hot { color: var(--accent); }
.statbar small { font-size: 11px; color: var(--muted); letter-spacing: .02em; }
.global { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
.global .ghead { font-weight: 500; }
.global .muted { color: var(--muted); font-size: 13px; }
.hist { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; height: 90px; align-items: end; max-width: 420px; width: 100%; margin: 0 auto; }
.hcol { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.hcol i { width: 100%; background: var(--line); border-radius: 4px 4px 0 0; display: block; }
.hcol.me i { background: var(--accent); }
.hcol small { font-size: 10px; color: var(--muted); }
.pulse { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); text-decoration: none; white-space: nowrap; }
.pulse i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); flex: none; }
.pulse b { color: var(--good); font-weight: 600; }
.pulse span.go { color: var(--ink); }
.pulse:hover span.go { text-decoration: underline; }
header { display: grid !important; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "brand pulse right"; align-items: center; column-gap: 18px; }
header .brand { grid-area: brand; } header .pulse { grid-area: pulse; } header .head-right { grid-area: right; }
@media (max-width: 560px) { header { grid-template-columns: 1fr auto; grid-template-areas: "brand right" "pulse pulse"; row-gap: 6px; } .pulse { font-size: 12px; } }
.stats-page h3 { font-size: 16px; font-weight: 600; }
.stats-page h4 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 6px; }
.sp-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.sp-live { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.sp-live b { color: var(--good); font-size: 18px; font-variant-numeric: tabular-nums; }
.sp-live i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 50%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; background: var(--bg); }
.seg-ctl button { border: 0; background: none; color: var(--muted); font: 500 13px var(--font-body); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.seg-ctl button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.sp-chart { position: relative; }
.sp-days { display: grid; gap: 3px; height: 140px; transition: opacity .2s; }
.sp-days.loading, .sp-daybox.loading { opacity: .4; }
.sp-day { display: flex; flex-direction: column; gap: 4px; align-items: center; border: 0; background: none; padding: 4px 0 0; border-radius: 6px; cursor: pointer; min-width: 0; }
.sp-day:hover, .sp-day:focus-visible { background: var(--bg); outline: none; }
.sp-day.sel { background: var(--accent-soft); }
.sp-day .bars { flex: 1; width: 100%; display: flex; gap: 2px; align-items: flex-end; padding: 0 2px; }
.sp-day .bars i { flex: 1; border-radius: 3px 3px 0 0; display: block; height: 0; transition: height .5s cubic-bezier(.2,.8,.2,1); }
.sp-day small { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; height: 14px; }
.sp-day.sel small { color: var(--accent); font-weight: 600; }
i.v { background: var(--muted); opacity: .45; } i.p { background: var(--accent); }
.sp-legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.sp-legend span { display: inline-flex; align-items: center; gap: 6px; } .sp-legend i { width: 10px; height: 10px; border-radius: 3px; display: block; }
.sp-legend .hint { margin-left: auto; }
.sp-tip { position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.45; padding: 7px 10px; border-radius: 8px; white-space: nowrap; pointer-events: none; z-index: 2; }
.sp-daybox { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; transition: opacity .2s; }
.sp-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .sp-tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.sp-tiles > div { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: auto 1fr; align-items: baseline; column-gap: 8px; }
.sp-tiles b { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sp-tiles .g { font-size: 13px; font-weight: 600; color: var(--accent); }
.sp-tiles small { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.stats-page .hist { height: 110px; max-width: none; }
.stats-page .hcol { border: 0; background: none; padding: 0; cursor: pointer; }
.stats-page .hcol i { background: var(--muted); opacity: .45; height: 0; transition: height .5s cubic-bezier(.2,.8,.2,1); }
.stats-page .hcol:hover i { opacity: .7; }
.stats-page .hcol.me i { background: var(--accent); opacity: 1; }
.sp-note { font-size: 12px; color: var(--muted); }
.sp-tests { display: flex; flex-direction: column; gap: 10px; }
.sp-trow { display: grid; grid-template-columns: 20px 120px minmax(0, 1fr) 32px; gap: 10px; align-items: center; font-size: 14px; }
.sp-trow .nm { display: flex; flex-direction: column; line-height: 1.2; }
.sp-trow em { font-style: normal; font-size: 11px; color: var(--anor); }
.sp-trow .track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.sp-trow .track i { display: block; height: 100%; width: 0; border-radius: 4px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.sp-trow b { text-align: right; font-variant-numeric: tabular-nums; }
.sp-foot { font-size: 13px; color: var(--muted); }
.home { min-height: 64vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding-block: 24px; }
.wordmark { font-size: clamp(44px, 12vw, 72px); font-weight: 600; letter-spacing: .06em; line-height: 1; }
.home-date { color: var(--muted); font-size: 14px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.home-tests { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; font-size: 12px; color: var(--muted); }
.home-test { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 60px; }
.home-test .tile { width: 54px; height: 54px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.ico { display: inline-grid; place-items: center; flex: none; }
.ico svg { display: block; }
.home-lead { font-size: 17px; max-width: 42ch; text-wrap: balance; }
.btn.play { min-width: 180px; justify-content: center; font-size: 16px; }
.home-test { cursor: pointer; }
.home-test:hover .tile { border-color: var(--muted); }
.howto-page h4 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 8px; }
.hw-flow { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.hw-flow li b { display: block; font-weight: 600; }
.hw-flow li span { color: var(--muted); font-size: 14px; }
.hw-tests { display: flex; flex-direction: column; }
.hw-test { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 6px; border-top: 1px solid var(--line); border-radius: 10px; scroll-margin: 80px; }
.hw-test.focus { background: var(--accent-soft); }
.hw-test .tile { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); display: grid; place-items: center; background: var(--surface); }
.hw-test b { font-weight: 600; } .hw-test p { font-size: 14px; color: var(--muted); } .hw-test small { font-size: 12px; color: var(--muted); }
.btn.sm { padding: 7px 12px; font-size: 13px; }
@media (max-width: 480px) { .hw-test { grid-template-columns: 40px minmax(0, 1fr); } .hw-test .btn { grid-column: 2; justify-self: start; } }
.hw-grades { font-size: 14px; }
.hw-tips { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 14px; }
.intro-card { align-items: center; text-align: center; gap: 12px; padding-block: 40px; }
.intro-card h2 { font-size: 26px; display: inline-flex; align-items: center; gap: 10px; }
.intro-card .about { max-width: 46ch; font-size: 16px; }
.intro-card .rule { display: block; text-wrap: balance; }
.intro-card .rule::before { display: inline-block; margin-right: 8px; vertical-align: middle; }
.more { font-size: 14px; color: var(--muted); max-width: 52ch; text-align: left; }
.more summary { cursor: pointer; text-align: center; list-style-position: inside; }
.more .steps { margin-top: 10px; color: var(--ink); }
.next-bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 15px; }
.next-label { color: var(--muted); }
.next-sec { font-size: 22px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.next-track { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: -8px; }
.next-track i { display: block; height: 100%; width: 0; background: var(--accent); }
.howto { display: grid; gap: 0; }
.howto > div { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.howto .ico { margin-top: 2px; }
.howto b { font-weight: 600; }
.howto p { grid-column: 2; color: var(--muted); font-size: 14px; }
.arch { display: flex; flex-direction: column; }
.arch-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 4px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--ink); font: 400 15px var(--font-body); text-align: left; cursor: pointer; }
.arch-row:hover { background: var(--bg); }
.arch-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.arch-no { color: var(--muted); font-variant-numeric: tabular-nums; }
.arch-score { font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
.arch-row.played .arch-score { color: var(--ink); }
.result-card { gap: 24px; }
.hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.hero .num { display: flex; align-items: center; gap: 18px; justify-content: center; }
.hero .num b { font-size: 88px; font-weight: 600; line-height: 1; letter-spacing: -.04em; color: var(--accent); }
.num-side { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.num-side strong { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.hero p.scale { font-size: 12px; }
.hero .num span { font-size: 18px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 5px 14px; border-radius: 999px; }
.hero p { color: var(--muted); font-size: 14px; }
.rows { display: flex; flex-direction: column; gap: 8px; }

<script>
(() => {
const GAME = "Sezgir";
const API = "https://sezgir-api.sezgir-uz.workers.dev"; // stats server (Cloudflare Worker) base URL; empty = global stats off
const LAUNCH = { y: 2026, m: 11, d: 12 }; // #1
const W = 800, H = 500;
const MONTHS = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];

// ---------- utils ----------
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const frame = () => new Promise(r => requestAnimationFrame(r));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const ARROW_L = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
const ARROW_R = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
// "go back" is a quiet text link at the top of a screen, never a button among the actions
function backLink(label, onClick) { const b = el("button", "back"); b.type = "button"; b.innerHTML = ARROW_L; b.append(label); b.addEventListener("click", onClick); return b; }
function btn(label, primary, onClick) { const b = el("button", primary ? "btn primary" : "btn", label); b.type = "button"; b.addEventListener("click", onClick); return b; }
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = hash(String(seed)); const f = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  return { next: f, range: (a, b) => a + (b - a) * f(), int: (a, b) => Math.floor(a + (b - a + 1) * f()), pick: arr => arr[Math.floor(f() * arr.length)], bool: () => f() < .5 }; }
function ymd(d = new Date()) { const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function puzzleNo(dateStr) { const [y, m, d] = dateStr.split("-").map(Number); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(LAUNCH.y, LAUNCH.m - 1, LAUNCH.d)) / 864e5) + 1; }
const store = {
  get(k, def) { try { const v = localStorage.getItem("sezgir:" + k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v) { try { localStorage.setItem("sezgir:" + k, JSON.stringify(v)); } catch {} }
};
function clientId() { let id = store.get("client", ""); if (!/^[a-z0-9]{16,40}$/.test(id)) { id = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(36).padStart(2, "0")).join("").slice(0, 24); store.set("client", id); } return id; }
async function api(path, body) { if (!API) return null; try { const r = await fetch(API + path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}); return r.ok ? await r.json() : null; } catch { return null; } }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800); }
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

// scoring: 50 points at an error of one "sigma", smooth bell curve
function scoreOf(err, sigma) { return Math.round(100 * Math.pow(0.5, (err / sigma) ** 2)); }
function title(s) { return s >= 90 ? "Burgut ko'z" : s >= 75 ? "Ziyrak" : s >= 60 ? "Hushyor" : s >= 40 ? "Chamalar" : "Adashgan"; }
function grade(s) { return s >= 95 ? "A+" : s >= 88 ? "A" : s >= 80 ? "B+" : s >= 70 ? "B" : s >= 62 ? "C+" : s >= 55 ? "C" : s >= 40 ? "D" : "F"; }
const GRADE_SCALE = "A+ 95+ · A 88+ · B+ 80+ · B 70+ · C+ 62+ · C 55+ · D 40+ · F 0–39".replace(/ (?=\d)/g, "\u00a0");
// line icons, 24×24, drawn in the test's colour
const ICONS = {
  anor: '<circle cx="12" cy="13.5" r="7.5"/><path d="M9.5 6.5 10.5 4h3l1 2.5"/><circle cx="9.5" cy="12.5" r=".9" fill="currentColor"/><circle cx="13.5" cy="11.5" r=".9" fill="currentColor"/><circle cx="12" cy="15.5" r=".9" fill="currentColor"/><circle cx="15" cy="15" r=".9" fill="currentColor"/>',
  chillak: '<path d="M3 20h18"/><path d="M5 17c3-11 9-11 13-1" stroke-dasharray="2 2.6"/><path d="m15.5 6.5 4-2"/>',
  minora: '<path d="M3 20.5h18"/><path d="m9.5 20.5 1-12h3l1 12"/><path d="M9 8.5h6"/><path d="M10.5 8.5V6a1.5 1.5 0 0 1 3 0v2.5"/><path d="M10.2 13h3.6M9.8 17h4.4"/>',
  doira: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="5.2"/><circle cx="12" cy="4" r=".8" fill="currentColor"/><circle cx="20" cy="12" r=".8" fill="currentColor"/><circle cx="12" cy="20" r=".8" fill="currentColor"/><circle cx="4" cy="12" r=".8" fill="currentColor"/>',
  non: '<circle cx="12" cy="12" r="8"/><path d="M12 12V4a8 8 0 0 1 7.6 10.5Z" fill="currentColor" fill-opacity=".22"/><circle cx="12" cy="12" r="2.6"/>',
  atlas: '<rect x="4" y="5" width="16" height="14" rx="2"/>'
};
function icon(t, size = 24) { const sp = el("span", "ico"); sp.style.color = `var(${t.color})`; sp.innerHTML = `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[t.id] || ""}</svg>`; return sp; }
function square(s) { return s >= 80 ? "🟩" : s >= 50 ? "🟨" : "🟥"; }

// ---------- stage ----------
const cv = $("#cv"), g = cv.getContext("2d"), hud = $("#hud"), stageBox = $("#stageBox"), screen = $("#screen"), progress = $("#progress");
function fit() { const r = cv.getBoundingClientRect(); if (!r.width) return; const dpr = window.devicePixelRatio || 1; cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); g.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0); }
new ResizeObserver(() => { if (!stageBox.hidden) { fit(); if (redraw) redraw(); } }).observe(stageBox);
let redraw = null; // last static scene, repainted after a resize
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
function clear() { g.fillStyle = css("--stage"); g.fillRect(0, 0, W, H); }
function text(t, x, y, o = {}) { g.save(); g.fillStyle = o.color || css("--ink"); g.font = `${o.weight || 600} ${o.size || 28}px ${css("--font-body")}`; g.textAlign = o.align || "center"; g.textBaseline = o.base || "middle"; g.globalAlpha = o.alpha ?? 1; g.fillText(t, x, y); g.restore(); }
function pill(t, x, y, o = {}) { g.save(); g.font = `600 ${o.size || 26}px ${css("--font-body")}`; const w = g.measureText(t).width + 36, h = (o.size || 26) + 22; g.fillStyle = o.bg || css("--surface"); g.strokeStyle = css("--line"); g.lineWidth = 2; g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, h / 2); g.fill(); g.stroke(); g.restore(); text(t, x, y, { size: o.size || 26, color: o.color }); }
function timerBar(frac) { g.fillStyle = css("--line"); g.fillRect(0, 0, W, 10); g.fillStyle = css("--accent"); g.fillRect(0, 0, W * (1 - clamp(frac, 0, 1)), 10); }
async function countdown(scene) { for (const n of ["3", "2", "1"]) { const t0 = performance.now(); while (performance.now() - t0 < 500) { clear(); if (scene) { g.save(); g.globalAlpha = .12; scene(); g.restore(); } const k = (performance.now() - t0) / 500; text(n, 400, 250, { size: 120, weight: 500, color: css("--accent"), alpha: 1 - k * .6 }); await frame(); } } }
function legend(items, y = 470) { // items: [label, color]
  g.save(); g.font = `500 26px ${css("--font-body")}`; const widths = items.map(([t]) => g.measureText(t).width + 48); let x = 400 - widths.reduce((a, b) => a + b, 0) / 2; g.restore();
  items.forEach(([t, c], i) => { g.fillStyle = c; g.beginPath(); g.arc(x + 10, y, 8, 0, 7); g.fill(); text(t, x + 24, y, { size: 26, weight: 500, align: "left", color: css("--muted") }); x += widths[i]; }); }

// ---------- audio ----------
let ac = null, noiseBuf = null;
function audio() { if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); noiseBuf = ac.createBuffer(1, ac.sampleRate * .2, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); } if (ac.state === "suspended") ac.resume(); return ac; }
function doira(when, loud = 1) { const a = audio(); if (!a) return; // frame-drum hit: low body + skin slap
  const o = a.createOscillator(), og = a.createGain(); o.type = "sine"; o.frequency.setValueAtTime(140, when); o.frequency.exponentialRampToValueAtTime(70, when + .18);
  og.gain.setValueAtTime(.0001, when); og.gain.exponentialRampToValueAtTime(.9 * loud, when + .005); og.gain.exponentialRampToValueAtTime(.0001, when + .25); o.connect(og).connect(a.destination); o.start(when); o.stop(when + .3);
  const n = a.createBufferSource(); n.buffer = noiseBuf; const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2200; f.Q.value = .8; const ng = a.createGain(); ng.gain.value = .5 * loud; n.connect(f).connect(ng).connect(a.destination); n.start(when); }

// ---------- panel (the text area under the stage) ----------
function live(main, sub) { const d = el("div", "live", main); if (sub) d.append(el("small", null, sub)); screen.replaceChildren(d); }

// ---------- the five tests ----------
const TESTS = [
{ id: "anor", name: "Anor donalari", short: "Sanash", color: "--anor", sigma: .2,
  about: "Anor 2 soniya ochiladi. Donalar sonini chamalab yozasiz.",
  steps: ["Tayyor bo'lgach 3-2-1 sanog'i boshlanadi.", "Anor 2 soniya ko'rinadi: donalarni birma-bir sanamang, umumiy ko'rinishdan chamalang.", "Keyin taxminiy sonni yozib, «Javob»ni bosing."],
  rule: "20% xato = 50 ball, aniq son = 100 ball",
  gen(r) { const n = r.int(30, 80); const seeds = []; let guard = 0; while (seeds.length < n && guard++ < 20000) { const a = r.range(0, Math.PI * 2), d = Math.sqrt(r.next()) * 168; const x = 400 + Math.cos(a) * d, y = 250 + Math.sin(a) * d; if (seeds.every(s => (s.x - x) ** 2 + (s.y - y) ** 2 > 22 * 22)) seeds.push({ x, y, rot: r.range(0, Math.PI) }); } return { n: seeds.length, seeds }; },
  fruit(alpha = 1) { g.save(); g.globalAlpha = alpha; g.fillStyle = "#a0566a"; g.beginPath(); g.arc(400, 250, 205, 0, 7); g.fill(); g.fillStyle = "#f4e9e4"; g.beginPath(); g.arc(400, 250, 190, 0, 7); g.fill(); g.restore(); },
  seeds(list, alpha = 1) { g.save(); g.globalAlpha = alpha; for (const s of list) { g.save(); g.translate(s.x, s.y); g.rotate(s.rot); g.fillStyle = css("--anor"); g.beginPath(); g.ellipse(0, 0, 9, 7, 0, 0, 7); g.fill(); g.fillStyle = "rgba(255,255,255,.45)"; g.beginPath(); g.ellipse(-3, -2.5, 3, 2, 0, 0, 7); g.fill(); g.restore(); } g.restore(); },
  preview() { clear(); this.fruit(); g.save(); g.globalAlpha = .35; text("?", 400, 250, { size: 150, weight: 500, color: css("--anor") }); g.restore(); },
  async run(p) { live("Diqqat bilan qarang", "anor 2 soniya ko'rinadi"); await countdown(() => this.fruit());
    const t0 = performance.now(); while (performance.now() - t0 < 2000) { clear(); this.fruit(); this.seeds(p.seeds); timerBar((performance.now() - t0) / 2000); await frame(); }
    clear(); this.fruit(.5); text("Nechta dona edi?", 400, 200, { size: 40 }); redraw = () => { clear(); this.fruit(.5); text("Nechta dona edi?", 400, 200, { size: 40 }); };
    live("Taxminiy sonni yozing", "sonni kiriting va «Javob»ni bosing");
    const guess = await new Promise(res => { const f = el("form", "row"); f.innerHTML = `<input id="countIn" class="count-in" type="number" inputmode="numeric" min="0" aria-label="Donalar soni" required><button class="btn primary" type="submit">Javob</button>`; screen.append(f); const i = f.querySelector("input"); i.focus(); f.addEventListener("submit", e => { e.preventDefault(); const v = parseInt(i.value, 10); if (!Number.isFinite(v) || v < 0) return; f.remove(); res(v); }); });
    const off = Math.abs(guess - p.n); return { err: off / p.n, human: off === 0 ? `Aynan ${p.n} ta edi. Zo'r!` : `Aslida ${p.n} ta edi, siz ${guess} dedingiz: ${off} ta (${Math.round(off / p.n * 100)}%) farq.`, guess }; },
  reveal(p, r) { clear(); this.fruit(.35); this.seeds(p.seeds, .3); text(String(p.n), 400, 225, { size: 110, color: css("--anor") }); text("dona bor edi", 400, 300, { size: 26, weight: 500, color: css("--muted") }); pill(`siz: ${r.guess}`, 400, 380, { color: css("--accent") }); } },

{ id: "chillak", name: "Chillak", short: "Kuzatish", color: "--gold", sigma: 75,
  about: "Chillak uchadi va yarim yo'lda g'oyib bo'ladi. Qayerga tushishini ko'rsatasiz.",
  steps: ["Chap tomondan chillak havoga otiladi.", "Uchishning yarmida u ko'zdan yo'qoladi.", "Yerning qaysi nuqtasiga tushishini taxmin qilib, o'sha joyga bosing."],
  rule: "75 px xato = 50 ball (maydon eni 800 px)",
  gen(r) { const G = 900, x0 = r.range(60, 150), land = r.range(470, 760), vy = r.range(470, 600), T = 2 * vy / G; return { G, x0, land, vy, vx: (land - x0) / T, T, spin: r.range(6, 11) * (r.bool() ? 1 : -1) }; },
  ground() { g.fillStyle = css("--line"); g.fillRect(0, 440, W, 60); g.strokeStyle = css("--muted"); g.lineWidth = 2; g.beginPath(); g.moveTo(0, 440); g.lineTo(W, 440); g.stroke(); },
  pos(p, t) { return { x: p.x0 + p.vx * t, y: 440 - (p.vy * t - .5 * p.G * t * t) }; },
  stick(x, y, rot, a = 1) { g.save(); g.globalAlpha = a; g.translate(x, y); g.rotate(rot); g.fillStyle = css("--gold"); g.beginPath(); g.roundRect(-18, -4, 36, 8, 4); g.fill(); g.restore(); },
  preview() { clear(); this.ground(); g.save(); g.setLineDash([4, 10]); g.strokeStyle = css("--muted"); g.lineWidth = 2; g.beginPath(); g.moveTo(110, 430); g.quadraticCurveTo(330, 60, 470, 250); g.stroke(); g.restore(); this.stick(110, 430, -.6); text("?", 640, 400, { size: 60, weight: 500, color: css("--accent") }); },
  run(p) { return new Promise(res => { live("Chillakni kuzating", "g'oyib bo'lgach, qayerga tushishini yerga bosib ko'rsating"); const t0 = performance.now() + 700, vis = .48 * p.T; let done = false;
    const onDown = e => { if (done) return; const t = (performance.now() - t0) / 1000; if (t < vis) return; done = true; cv.removeEventListener("pointerdown", onDown); const x = clamp(toLogical(e).x, 0, W); const d = Math.abs(x - p.land); res({ err: d, human: d < 6 ? "Deyarli aynan tushgan joyga bosdingiz!" : `Chillak siz ko'rsatgan joydan ${Math.round(d)} px ${x < p.land ? "uzoqroqqa" : "yaqinroqqa"} tushdi.`, x }); };
    cv.addEventListener("pointerdown", onDown);
    const loop = () => { if (done) return; const t = (performance.now() - t0) / 1000; clear(); this.ground();
      if (t < 0) { this.stick(p.x0, 434, 0); text("tayyorlaning...", 400, 120, { size: 30, weight: 500, color: css("--muted") }); }
      else { const a = t < vis ? 1 : clamp(1 - (t - vis) / .15, 0, 1); if (a > 0) { const q = this.pos(p, Math.min(t, p.T)); this.stick(q.x, q.y, t * p.spin, a); } else { text("Qayerga tushadi?", 400, 110, { size: 38 }); text("yer chizig'iga bosing", 400, 160, { size: 26, weight: 500, color: css("--muted") }); } }
      requestAnimationFrame(loop); }; loop(); }); },
  reveal(p, r) { clear(); this.ground(); g.save(); g.setLineDash([4, 8]); g.strokeStyle = css("--muted"); g.lineWidth = 2; g.beginPath(); for (let i = 0; i <= 60; i++) { const q = this.pos(p, p.T * i / 60); i ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y); } g.stroke(); g.restore();
    this.stick(p.land, 434, 0); g.fillStyle = css("--accent"); g.beginPath(); g.moveTo(r.x, 446); g.lineTo(r.x - 12, 466); g.lineTo(r.x + 12, 466); g.fill();
    g.strokeStyle = css("--ink"); g.lineWidth = 2; g.beginPath(); g.moveTo(Math.min(r.x, p.land), 482); g.lineTo(Math.max(r.x, p.land), 482); g.stroke();
    text(`${Math.round(r.err)} px`, 400, 90, { size: 44 }); legend([["chillak tushgan joy", css("--gold")], ["siz bosgan joy", css("--accent")]], 140); } },

{ id: "minora", name: "Minora", short: "Balandlik", color: "--accent", sigma: .1,
  about: "Minora 1,5 soniya ko'rinadi. Keyin yonida xuddi shu balandlikdagi minorani o'zingiz qurasiz.",
  steps: ["3-2-1 dan keyin chap tomonda minora 1,5 soniya ko'rinadi.", "Uning balandligini eslab qoling: keyin minora yo'qoladi.", "O'ng tomondagi minorani yuqoriga-pastga surib, o'sha balandlikka keltiring va «Shu balandlik»ni bosing."],
  rule: "10% farq = 50 ball (aniq balandlik = 100 ball)",
  gen(r) { const h = r.range(150, 390); let start; do { start = r.range(130, 400); } while (Math.abs(start - h) < 70); return { h, start }; },
  ground() { g.fillStyle = css("--line"); g.fillRect(0, 450, W, 50); g.strokeStyle = css("--muted"); g.lineWidth = 2; g.beginPath(); g.moveTo(0, 450); g.lineTo(W, 450); g.stroke(); },
  tower(x, h, color, alpha = 1) { const T = 450 - h; g.save(); g.globalAlpha = alpha; g.fillStyle = color;
    g.beginPath(); g.moveTo(x - 30, 450); g.lineTo(x - 22, T + 50); g.lineTo(x + 22, T + 50); g.lineTo(x + 30, 450); g.closePath(); g.fill();
    g.beginPath(); g.roundRect(x - 32, T + 40, 64, 10, 3); g.fill(); g.fillRect(x - 16, T + 17, 32, 24); g.beginPath(); g.arc(x, T + 17, 16, Math.PI, 0); g.fill();
    g.globalAlpha = alpha * .25; g.fillStyle = "#fff"; for (let y = T + 80; y < 430; y += 46) { const w = 22 + 8 * (y - T - 50) / (400 - T); g.fillRect(x - w + 4, y, 2 * w - 8, 4); } g.fillRect(x - 6, T + 22, 12, 14); g.restore(); },
  preview() { clear(); this.ground(); this.tower(250, 300, css("--accent")); this.tower(550, 210, css("--muted"), .35); text("?", 550, 180, { size: 60, weight: 500, color: css("--accent") }); },
  async run(p) { live("Balandlikni eslab qoling", "minora 1,5 soniya ko'rinadi"); await countdown(() => { this.ground(); });
    const t0 = performance.now(); while (performance.now() - t0 < 1500) { clear(); this.ground(); this.tower(230, p.h, css("--accent")); timerBar((performance.now() - t0) / 1500); await frame(); }
    live("Endi o'sha balandlikni quring", "minorani yuqoriga-pastga suring, so'ng «Shu balandlik»ni bosing");
    let h = p.start, drag = false;
    const draw = () => { clear(); this.ground(); g.save(); g.setLineDash([6, 8]); g.strokeStyle = css("--line"); g.lineWidth = 2; g.strokeRect(200, 60, 60, 390); g.restore(); text("?", 230, 300, { size: 48, weight: 500, color: css("--muted") }); this.tower(570, h, css("--ink"), .85); text("↕", 650, 450 - h + 20, { size: 34, weight: 500, color: css("--muted") }); }; redraw = draw;
    const setFrom = e => { h = clamp(450 - toLogical(e).y, 100, 430); draw(); };
    const down = e => { drag = true; cv.setPointerCapture(e.pointerId); setFrom(e); }, move = e => { if (drag) setFrom(e); }, up = () => drag = false;

function setMeta(no, ds) { $("#meta").textContent = `#${no} · ${prettyDate(ds)}`; }

function statsOf() {
  const hist = store.get("history", {}); const days = Object.keys(hist).sort(); const scores = days.map(d => hist[d].total);

  return { played: days.length, streak, best: scores.length ? Math.max(...scores) : 0, avg: scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0 };
}

function radar(scores, labels) { const NS = "http://www.w3.org/2000/svg", cx = 150, cy = 145, R = 86; const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", "-50 0 400 290"); svg.style.overflow = "visible"; svg.setAttribute("class", "radar"); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Testlar bo'yicha ballar diagrammasi");
  const add = (tag, attrs, txt) => { const e = document.createElementNS(NS, tag); for (const k in attrs) { const v = attrs[k]; if (typeof v === "string" && v.startsWith("var(")) e.style.setProperty(k, v); else e.setAttribute(k, v); } if (txt != null) e.textContent = txt; svg.append(e); return e; };
  [.25, .5, .75, 1].forEach(k => add("polygon", { points: [0, 1, 2, 3, 4].map(i => pt(i, R * k).join(",")).join(" "), fill: "none", stroke: "var(--line)", "stroke-width": 1 }));
  [0, 1, 2, 3, 4].forEach(i => { const [x, y] = pt(i, R); add("line", { x1: cx, y1: cy, x2: x, y2: y, stroke: "var(--line)", "stroke-width": 1 }); });
  add("polygon", { points: scores.map((s, i) => pt(i, R * Math.max(s, 3) / 100).join(",")).join(" "), fill: "var(--accent)", "fill-opacity": .18, stroke: "var(--accent)", "stroke-width": 2 });
  scores.forEach((s, i) => { const [x, y] = pt(i, R * Math.max(s, 3) / 100); add("circle", { cx: x, cy: y, r: 3.5, fill: "var(--accent)" }); const [lx, ly] = pt(i, R + 30); const anchor = Math.abs(lx - cx) < 5 ? "middle" : lx > cx ? "start" : "end"; add("text", { x: lx, y: ly + 4, "text-anchor": anchor }, `${labels[i]} ${s}`); });
  return svg; }
